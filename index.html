<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamShield – AI-Powered Digital Fraud Detection</title>
<meta name="description" content="Paste a suspicious SMS, WhatsApp message, email, link or screenshot and see an explainable fraud-risk score. Privacy-first: nothing is stored.">
<meta name="theme-color" content="#030c0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke=%27%23ff4d2e%27 stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3l8 3v6c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V6l8-3z'/%3E%3Cpath d='M9 12l2 2 4-4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#030c0f; --bg2:#06191d; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(110,210,210,.16); --line2:rgba(110,210,210,.28);
  --text:#e9efff; --muted:#a9c8cc; --faint:#6f9498;
  --blue:#ff4d2e; --blue2:#ff7b5c; --cyan:#22d3ee;
  --low:#2ee59d; --med:#ffc24a; --high:#ff8a3d; --crit:#ff4d6a;
  --radius:18px; --shadow:0 20px 60px -20px rgba(0,0,0,.65);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 85% -5%,rgba(255,84,60,.22),transparent 60%),radial-gradient(700px 480px at -5% 15%,rgba(34,211,238,.10),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(255,84,60,.12),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%)}
a{color:var(--blue2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--blue);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}.skip:focus{left:8px}
svg.i{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* nav */
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);background:rgba(3,13,16,.72);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;color:var(--text)!important;text-decoration:none!important}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 6px 24px -6px rgba(255,84,60,.8);color:#fff}
.logo b{background:linear-gradient(90deg,#fff,#ffd2c6);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:0;margin-left:6px}
.links a{white-space:nowrap;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:500;font-size:.92rem;text-decoration:none;display:flex;align-items:center;gap:7px;transition:.2s}
.links a:hover{color:var(--text);background:var(--card)}
.links a.on{color:#fff;background:rgba(255,84,60,.2);box-shadow:inset 0 0 0 1px rgba(255,130,100,.4)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--low);box-shadow:0 0 10px var(--low)}.dot.warn{background:var(--med);box-shadow:0 0 10px var(--med)}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);place-items:center;font-size:1.2rem}
.drawer{display:none}

/* layout + cards */
main{padding:34px 0 70px;outline:0}
.page{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card{padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head h2,.card-head h3{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.card-head h2 .i,.card-head h3 .i{color:var(--blue2)}
.muted{color:var(--muted)}.small{font-size:.86rem}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.06;letter-spacing:-.035em;font-weight:800}
h2.sec{font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:-.025em;font-weight:800;margin:0 0 6px}
.grad{background:linear-gradient(90deg,#ff7b5c,#22d3ee 60%,#7cf2c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--cyan);padding:6px 12px;border-radius:99px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);margin-bottom:16px}
.lead{color:var(--muted);font-size:1.08rem;max-width:58ch}
.page-head{margin-bottom:24px}.page-head p{color:var(--muted);max-width:70ch}
section.block{margin-top:56px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:.95rem;border:1px solid var(--line2);background:var(--card);color:var(--text);transition:.18s;text-decoration:none!important;white-space:nowrap}
.btn:hover{background:var(--card2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(135deg,#ff4d2e,#d9261c);border-color:#ff7a5c;color:#fff;box-shadow:0 10px 30px -10px rgba(255,84,60,.9)}
.btn.primary:hover{background:linear-gradient(135deg,#ff6a4a,#e8321f);box-shadow:0 14px 34px -10px rgba(255,84,60,1)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.55;pointer-events:none}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:20px 0 10px}
.hero .cta{margin-top:26px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--muted);font-size:.88rem}
.trust span{display:flex;gap:7px;align-items:center}.trust .i{color:var(--low)}
.preview{padding:18px;position:relative}
.preview .bubble{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:.92rem;line-height:1.6;min-height:132px}
.preview-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.8rem;color:var(--muted)}
.preview-foot{display:flex;align-items:center;gap:14px;margin-top:14px}
.mini-score{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.floaty{position:absolute;right:-8px;top:-14px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:38px}
.stat{padding:18px 20px}.stat b{display:block;font-size:1.9rem;font-weight:800;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:.86rem}

/* scanner */
textarea,input[type=text],input[type=url]{width:100%;font:inherit;color:var(--text);background:rgba(3,11,14,.55);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;transition:.2s;resize:vertical}
textarea{min-height:170px;line-height:1.6}
textarea:focus,input:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(255,84,60,.2)}
textarea::placeholder,input::placeholder{color:var(--faint)}
.scanner-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.count{font-size:.8rem;color:var(--faint);font-family:var(--mono)}
.err{margin-top:12px;padding:11px 14px;border-radius:12px;background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.4);color:#ffb4c0;font-size:.9rem;animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.demos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.demo{text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:.2s;display:flex;flex-direction:column;gap:6px;min-height:92px}
.demo:hover{border-color:var(--blue2);background:rgba(255,84,60,.1);transform:translateY(-2px)}
.demo b{font-size:.88rem;line-height:1.25}
.chan{font-size:.7rem;color:var(--faint);display:flex;gap:6px;align-items:center;margin-top:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:99px;width:max-content}
.tag.scam{background:rgba(255,77,106,.14);color:#ff8ea0}.tag.ok{background:rgba(46,229,157,.13);color:var(--low)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--text)}
.chip.mono{font-family:var(--mono);font-size:.76rem}
.chip.btnlike{cursor:pointer}.chip.btnlike:hover{border-color:var(--blue2);background:rgba(255,84,60,.12)}

/* loading */
.loader{padding:34px 22px;text-align:center;position:relative;overflow:hidden}
.radar{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;position:relative;border:1px solid var(--line2);background:radial-gradient(circle,rgba(255,84,60,.2),transparent 70%)}
.radar::before,.radar::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid var(--line2)}
.radar::after{inset:32px}
.radar i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(34,211,238,.0),rgba(34,211,238,.55));animation:spin 1.2s linear infinite;-webkit-mask-image:radial-gradient(circle,transparent 0,#000 1px);}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;max-width:380px;margin:16px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:9px;transition:width .35s}
.steps{display:flex;flex-direction:column;gap:7px;align-items:flex-start;width:max-content;max-width:100%;margin:16px auto 0;font-size:.9rem;color:var(--faint)}
.steps div{display:flex;gap:9px;align-items:center;transition:.3s}.steps div.on{color:var(--text)}.steps div.done{color:var(--low)}

/* gauge */
.gauge{position:relative;width:100%;max-width:300px;margin:0 auto}
.gauge svg{width:100%;height:auto;display:block;overflow:visible}
.zone{stroke-width:17;fill:none;stroke-linecap:butt;opacity:.28;transition:.3s;cursor:pointer}
.zone.on{opacity:1;filter:drop-shadow(0 0 7px currentColor)}
.zone:hover,.zone:focus{opacity:.8;outline:0}
.needle{transform-origin:120px 120px;transform:rotate(-90deg);transition:transform 1.5s cubic-bezier(.2,.9,.25,1.12)}
.gauge-num{text-align:center;margin-top:2px}
.gauge-num b{font-size:3.1rem;font-weight:800;letter-spacing:-.05em;line-height:1}.gauge-num small{font-size:1.2rem;font-weight:700;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;padding:6px 13px;border-radius:99px;border:1px solid currentColor}
.lvl.Low{color:var(--low);background:rgba(46,229,157,.1)}.lvl.Medium{color:var(--med);background:rgba(255,194,74,.1)}.lvl.High{color:var(--high);background:rgba(255,138,61,.1)}.lvl.Critical{color:var(--crit);background:rgba(255,77,106,.12)}
.legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.legend button{font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);transition:.2s}
.legend button:hover,.legend button.sel{color:#fff;border-color:currentColor}
.legend .Low.sel,.legend .Low:hover{color:var(--low)}.legend .Medium.sel,.legend .Medium:hover{color:var(--med)}.legend .High.sel,.legend .High:hover{color:var(--high)}.legend .Critical.sel,.legend .Critical:hover{color:var(--crit)}
.zone-tip{text-align:center;font-size:.84rem;color:var(--muted);min-height:2.7em;margin-top:8px;padding:0 6px}

/* results */
.res-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.verdict{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:12px 0 6px}
.center{text-align:center}
.disclaim{display:flex;gap:10px;font-size:.82rem;color:var(--muted);padding:12px 14px;border-radius:12px;background:rgba(255,84,60,.07);border:1px solid rgba(255,130,100,.22);margin-top:14px;text-align:left}
.disclaim .i{color:var(--blue2);margin-top:2px}
.cat{display:grid;grid-template-columns:24px 1fr 44px;gap:10px;align-items:center;padding:7px 0;font-size:.88rem}
.cat.zero{opacity:.45}
.meter{height:7px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.cat b{text-align:right;font-family:var(--mono);font-size:.8rem}
.msgbox{background:rgba(3,11,14,.6);border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;word-break:break-word;line-height:1.85;font-size:.95rem}
mark.hl{background:rgba(255,77,106,.2);color:#ffd5dc;border-bottom:2px solid var(--crit);border-radius:4px;padding:1px 3px;cursor:help}
mark.hl.phishing{background:rgba(255,194,74,.16);color:#ffe3a6;border-color:var(--med)}
mark.hl.otp,mark.hl.upi{background:rgba(255,138,61,.18);color:#ffd2b0;border-color:var(--high)}
mark.hl.general{background:rgba(255,130,100,.16);color:#cfe0ff;border-color:var(--blue2)}
.sig{display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sig+.sig{margin-top:10px}
.sig .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,77,106,.12);color:#ff8ea0}
.sig.neg .ic{background:rgba(46,229,157,.12);color:var(--low)}
.sig h4{font-size:.95rem;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sig p{font-size:.86rem;color:var(--muted);margin-top:3px}
.sig .q{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.w{font-family:var(--mono);font-size:.8rem;font-weight:600;padding:4px 9px;border-radius:8px;height:max-content;background:rgba(255,77,106,.12);color:#ff8ea0}
.neg .w{background:rgba(46,229,157,.12);color:var(--low)}
.tactic{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cyan);background:rgba(34,211,238,.09);border-radius:99px;padding:2px 8px}
.rec{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}
.rec:first-child{border-top:0}.rec .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,84,60,.15);color:var(--blue2);flex:none}
.rec.first .ic{background:rgba(255,77,106,.15);color:#ff8ea0}
.linkcard{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.linkcard+.linkcard{margin-top:10px}
.linkcard code,.urlbox{font-family:var(--mono);font-size:.82rem;word-break:break-all}
details{border-radius:14px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary .i.chev{margin-left:auto;transition:.2s}details[open]>summary .i.chev{transform:rotate(180deg)}
table.bd{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:12px}
table.bd td{padding:7px 4px;border-bottom:1px solid var(--line)}table.bd td:last-child{text-align:right;font-family:var(--mono)}
.formula{font-family:var(--mono);font-size:.8rem;background:rgba(3,11,14,.6);padding:10px 12px;border-radius:10px;margin-top:12px;color:var(--cyan)}
.ai{border:1px solid rgba(124,242,201,.3);background:rgba(124,242,201,.06);border-radius:14px;padding:14px;font-size:.9rem}

/* url */
.anat{display:flex;flex-wrap:wrap;font-family:var(--mono);font-size:.95rem;padding:14px 16px;background:rgba(3,11,14,.6);border:1px solid var(--line);border-radius:14px;word-break:break-all;line-height:1.9}
.anat span{padding:0 1px;border-radius:5px}.anat .sc{color:var(--faint)}.anat .sd{color:var(--med)}.anat .dm{color:var(--text);font-weight:700;background:rgba(255,84,60,.2)}.anat .tl{color:var(--cyan);font-weight:700}.anat .pt{color:var(--muted)}.anat .ui{color:var(--crit);text-decoration:underline wavy}
.anat-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:var(--muted)}
.chk{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.chk:first-child{border-top:0}
.chk .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.chk.bad .ic{background:rgba(255,77,106,.15);color:#ff8ea0}.chk.warn .ic{background:rgba(255,194,74,.15);color:var(--med)}.chk.good .ic{background:rgba(46,229,157,.14);color:var(--low)}.chk.info .ic{background:rgba(255,130,100,.15);color:var(--blue2)}
.chk b{font-size:.92rem}.chk p{font-size:.84rem;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(46,229,157,.07);border:1px solid rgba(46,229,157,.28);font-size:.86rem;color:#bff5df;margin-top:12px}
.notice .i{margin-top:2px;color:var(--low)}

/* screenshot */
.drop{border:2px dashed var(--line2);border-radius:18px;padding:38px 20px;text-align:center;transition:.2s;cursor:pointer;background:rgba(255,255,255,.02)}
.drop:hover,.drop.over{border-color:var(--blue2);background:rgba(255,84,60,.08)}
.drop .big{width:58px;height:58px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:rgba(255,84,60,.15);color:var(--blue2);font-size:1.5rem}
.shot{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.shot img{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;display:block}

/* awareness */
.acc{padding:0}.acc summary{padding:16px 18px}
.acc .body{padding:0 18px 18px;font-size:.9rem;color:var(--muted)}
.acc .body ul{padding-left:18px;margin:8px 0}.acc .body li{margin:3px 0}
.acc .ex{font-family:var(--mono);font-size:.78rem;padding:10px 12px;background:rgba(3,11,14,.6);border-left:3px solid var(--crit);border-radius:8px;margin:8px 0;color:#ffd5dc}
.acc .do{color:var(--low);font-weight:600}
.acc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,84,60,.15);color:var(--blue2)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;counter-reset:s}
.flow>div{padding:18px;position:relative}
.flow>div::before{counter-increment:s;content:counter(s);position:absolute;top:-12px;left:16px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff}
.flow b{display:block;margin-bottom:4px}.flow p{font-size:.84rem;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.18s;text-align:left;width:100%}
.check:hover{border-color:var(--line2)}
.check .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent;margin-top:1px}
.check.on{border-color:rgba(255,77,106,.5);background:rgba(255,77,106,.07)}.check.on .bx{background:var(--crit);border-color:var(--crit);color:#fff}
.check small{display:block;color:var(--muted);font-size:.8rem}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vs .col{padding:16px;border-radius:14px;border:1px solid var(--line)}
.vs .good{background:rgba(46,229,157,.06);border-color:rgba(46,229,157,.3)}.vs .bad{background:rgba(255,77,106,.06);border-color:rgba(255,77,106,.3)}
.vs .msg{font-size:.88rem;margin:8px 0 10px;padding:10px 12px;background:rgba(3,11,14,.55);border-radius:10px;line-height:1.6}
.vs ul{list-style:none;padding:0;font-size:.8rem;color:var(--muted)}.vs li{display:flex;gap:7px;margin:3px 0}
.vs .good li .i{color:var(--low)}.vs .bad li .i{color:var(--crit)}
.quiz .q{font-size:1.05rem;padding:18px;background:rgba(3,11,14,.55);border-radius:14px;border:1px solid var(--line);line-height:1.7}
.quiz .fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.9rem}.quiz .fb.ok{background:rgba(46,229,157,.09);border:1px solid rgba(46,229,157,.35)}.quiz .fb.no{background:rgba(255,77,106,.09);border:1px solid rgba(255,77,106,.35)}
.tip{padding:18px}.tip .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,84,60,.15);color:var(--blue2);margin-bottom:10px}.tip b{display:block;margin-bottom:3px}.tip p{font-size:.86rem;color:var(--muted)}
.help{padding:22px;border-color:rgba(255,194,74,.35)!important;background:linear-gradient(180deg,rgba(255,194,74,.08),rgba(255,194,74,.02))!important}
.help big{font-size:2rem;font-weight:800;color:var(--med);letter-spacing:-.02em}

/* about */
.arch{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center}
.node{flex:1 1 170px;padding:14px;border-radius:14px;text-align:center;background:var(--card);border:1px solid var(--line);font-size:.84rem}
.node b{display:block;font-size:.92rem;margin:6px 0 2px}.node .ic{color:var(--blue2);font-size:1.4rem}.node span{color:var(--muted)}
.arrow{align-self:center;color:var(--blue2);font-size:1.4rem}
table.tech{width:100%;border-collapse:collapse;font-size:.9rem}
table.tech td{padding:11px 8px;border-top:1px solid var(--line);vertical-align:top}table.tech td:first-child{font-weight:700;width:34%;color:var(--blue2)}
ul.tick{list-style:none;padding:0}ul.tick li{display:flex;gap:10px;padding:6px 0;font-size:.93rem}ul.tick .i{color:var(--low);margin-top:3px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--faint);font-size:.84rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#08242a;border:1px solid var(--line2);padding:11px 18px;border-radius:12px;font-size:.9rem;z-index:99;transition:.3s;pointer-events:none;box-shadow:var(--shadow);max-width:92vw}
#toast.show{transform:translate(-50%,0);opacity:1}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}.empty .big{font-size:2.2rem;color:var(--blue2);margin-bottom:8px}

@media (max-width:1180px){.links a .i{display:none}}
@media (max-width:1020px){
  .links,.nav .pill{display:none}.burger{display:grid;margin-left:auto}
  .drawer.open{display:flex;flex-direction:column;gap:4px;padding:12px 20px 18px;border-top:1px solid var(--line);background:rgba(3,13,16,.96)}
  .drawer a{padding:12px 14px;border-radius:12px;color:var(--text);text-decoration:none;display:flex;gap:10px;align-items:center}.drawer a.on{background:rgba(255,84,60,.2)}
  .hero{grid-template-columns:1fr}.res-grid{grid-template-columns:1fr}.demos{grid-template-columns:repeat(3,1fr)}
  .flow{grid-template-columns:1fr 1fr;row-gap:24px}.g4{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:680px){
  main{padding-top:22px}.wrap{padding:0 16px}
  .g2,.g3,.vs,.shot{grid-template-columns:1fr}.demos{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}
  .card{padding:16px}.sig{grid-template-columns:32px 1fr}.sig .w{grid-column:2;justify-self:start}
  .floaty{display:none}.scanner-bar .row{width:100%}.scanner-bar .row .btn.primary{flex:1}
  .arrow{display:none}.chk{grid-template-columns:30px 1fr}.chk .w{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.needle{transition:none!important}}
/* ===================== v2 visual upgrade, alarm, helplines ===================== */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#ff4d2e;left:-12vmax;top:-14vmax}
.aurora i:nth-child(2){background:#22d3ee;right:-16vmax;top:18vh;animation-duration:28s;opacity:.14}
.aurora i:nth-child(3){background:#ff8a3d;left:25vw;bottom:-26vmax;animation-duration:34s;opacity:.18}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}
.grad{background-image:linear-gradient(90deg,#ff7b5c,#22d3ee,#7cf2c9,#22d3ee,#5b9bff);background-size:200% auto;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:200% center}}
.preview .bubble{position:relative;overflow:hidden}
.preview .bubble::after{content:"";position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(180deg,transparent,rgba(34,211,238,.28),transparent);animation:laser 3.2s linear infinite;pointer-events:none}
@keyframes laser{to{top:100%}}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.glass{transition:transform .25s,box-shadow .25s,border-color .25s}
a.glass.card:hover,.tip:hover{transform:translateY(-4px);border-color:rgba(255,130,100,.5);box-shadow:0 24px 60px -22px rgba(255,84,60,.55)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.ticker{overflow:hidden;margin-top:30px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .track{display:flex;gap:44px;width:max-content;padding:11px 0;animation:tick 48s linear infinite;color:var(--muted);font-size:.86rem}
.ticker span{display:flex;gap:8px;align-items:center;white-space:nowrap}.ticker .i{color:var(--crit)}
.ticker:hover .track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);color:var(--text);flex:none;transition:.2s}
.iconbtn:hover{border-color:var(--blue2);background:rgba(255,84,60,.12)}.iconbtn.off{color:var(--faint)}
.sos{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:9px;padding:12px 17px;border-radius:99px;background:linear-gradient(135deg,#ff4d6a,#d61f45);color:#fff!important;font-weight:700;font-size:.9rem;text-decoration:none!important;animation:sospulse 2.4s infinite}
@keyframes sospulse{0%{box-shadow:0 0 0 0 rgba(255,77,106,.6),0 12px 34px -8px rgba(255,77,106,.8)}70%,100%{box-shadow:0 0 0 18px rgba(255,77,106,0),0 12px 34px -8px rgba(255,77,106,.8)}}
.sos:hover{transform:translateY(-2px)}
textarea.dragover{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.22)}
/* fraud alarm */
.alert-ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(40,0,8,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:ovin .25s;overflow-y:auto}
.alert-ov::before{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 130px 24px rgba(255,40,70,.8);animation:redpulse 1s ease-in-out infinite}
@keyframes ovin{from{opacity:0}}@keyframes redpulse{50%{opacity:.2}}
.alert-box{position:relative;max-width:580px;width:100%;text-align:center;padding:30px 26px;border-radius:22px;background:linear-gradient(180deg,#2a0610,#14030a);border:2px solid #ff4d6a;box-shadow:0 0 70px rgba(255,40,70,.6)}
.alert-box .siren{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#ff2d55;color:#fff;font-size:2.6rem;animation:sirenpop 1s ease-in-out infinite}
@keyframes sirenpop{50%{transform:scale(1.12);box-shadow:0 0 0 16px rgba(255,45,85,.18)}}
.alert-box h2{font-size:clamp(1.9rem,7vw,2.8rem);color:#ff4d6a;letter-spacing:.04em;font-weight:900;text-transform:uppercase;line-height:1.05;text-shadow:0 0 24px rgba(255,40,70,.9)}
.alert-box .big{color:#ffd5dc;font-weight:800;margin:10px 0 4px;font-size:1.05rem}
.alert-box .score{display:inline-block;margin:8px 0;padding:5px 14px;border-radius:99px;border:1px solid #ff4d6a;color:#ff8ea0;font-weight:800;font-family:var(--mono);font-size:.9rem}
.alert-box ul{list-style:none;padding:0;margin:12px 0 4px;text-align:left}
.alert-box li{display:flex;gap:9px;padding:7px 11px;margin:5px 0;border-radius:10px;background:rgba(255,77,106,.1);color:#ffd5dc;font-size:.92rem}
.alert-box li .i{color:#ff6b86;margin-top:3px}
.alert-box .row{justify-content:center;margin-top:18px}
.btn.danger{background:linear-gradient(135deg,#ff4d6a,#d61f45);border-color:#ff7b92;color:#fff;box-shadow:0 10px 30px -10px rgba(255,45,85,.9)}
.btn.danger:hover{background:linear-gradient(135deg,#ff6b86,#e5254d)}
.fraud-banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:16px;margin-bottom:18px;background:linear-gradient(90deg,rgba(255,45,85,.26),rgba(255,45,85,.1));border:2px solid #ff4d6a;animation:bannerglow 1.4s ease-in-out infinite}
@keyframes bannerglow{50%{box-shadow:0 0 0 4px rgba(255,77,106,.25),0 0 34px rgba(255,77,106,.5)}}
.fraud-banner .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ff2d55;color:#fff;font-size:1.5rem;flex:none}
.fraud-banner .t{flex:1 1 260px}.fraud-banner b{display:block;color:#ff6b86;font-size:1.2rem;font-weight:900;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.fraud-banner .t span{color:#ffd5dc;font-size:.93rem}
/* helplines */
.hl-card{padding:18px;display:flex;flex-direction:column;gap:8px}
.hl-card h3{font-size:1rem;line-height:1.3}.hl-card p{font-size:.86rem;color:var(--muted);flex:1}
.hl-num{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;color:var(--med);line-height:1.1}
.hl-card.top{border-color:rgba(255,77,106,.5)!important;background:linear-gradient(180deg,rgba(255,77,106,.14),rgba(255,77,106,.03))!important}
.hl-card.top .hl-num{color:#ff8ea0;font-size:2.8rem}
.region-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.region-tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:.88rem;transition:.2s}
.region-tabs button:hover{color:var(--text);border-color:var(--line2)}
.region-tabs button.on{color:#fff;background:rgba(255,84,60,.22);border-color:var(--blue2)}
.hl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line)}.hl-row:first-child{border-top:0}
.hl-row b{display:block}.hl-row span.d{font-size:.84rem;color:var(--muted)}
.urgent{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.5);margin-bottom:18px}
.urgent .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#ff2d55;color:#fff;font-size:1.3rem;flex:none}
.hl-strip{padding:24px;border-color:rgba(255,77,106,.4)!important;background:linear-gradient(120deg,rgba(255,77,106,.14),rgba(255,84,60,.08))!important}
@media (max-width:1320px){.nav .pill{display:none}.nav .wrap{gap:12px}.links a{padding:8px 8px;font-size:.9rem}}
@media (max-width:680px){.sos{right:12px;bottom:12px;padding:11px 14px}.sos .lbl{display:none}.alert-box{padding:24px 18px}}

/* ===================== v3 background art ===================== */
.bgart{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(3,11,14,.82) 0%,rgba(3,11,14,.45) 45%,rgba(3,11,14,0) 75%),var(--art) center top/cover no-repeat;opacity:.6;transition:opacity .6s;-webkit-mask-image:linear-gradient(#000 60%,rgba(0,0,0,.55));mask-image:linear-gradient(#000 60%,rgba(0,0,0,.55))}
body:not(.is-home) .bgart{opacity:.22}
body.is-home section.hero{padding:46px 0 26px}
.page-head{position:relative;overflow:hidden;padding:30px 28px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(3,13,16,.94) 38%,rgba(3,13,16,.35)),var(--art) center/cover;box-shadow:var(--shadow)}
#home-scanner{background:linear-gradient(rgba(3,13,16,.88),rgba(3,13,16,.82)),url(assets/scam-bg.svg) center/cover!important}
.hl-strip{background:linear-gradient(110deg,rgba(40,4,14,.9),rgba(3,13,16,.7)),url(assets/lock-bg.svg) center/cover!important}

/* ===================== v4 cyber-warning theme, QR + number tools ===================== */
:root{--ember:#ff4d2e;--amber:#ffa43d;--teal:#22e0d0}
body{background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 85% -8%,rgba(255,60,40,.26),transparent 60%),radial-gradient(700px 480px at -5% 15%,rgba(34,224,208,.09),transparent 60%),radial-gradient(800px 600px at 50% 112%,rgba(255,60,40,.16),transparent 60%)}
body::before{background-image:linear-gradient(rgba(110,210,210,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(110,210,210,.055) 1px,transparent 1px)}
.bgart{background:linear-gradient(90deg,rgba(3,11,14,.9) 0%,rgba(3,11,14,.55) 42%,rgba(3,11,14,.12) 85%),var(--art) center top/cover no-repeat;opacity:.8;filter:saturate(1.15) contrast(1.05)}
body:not(.is-home) .bgart{opacity:.34}
.bgart::before{content:"";position:absolute;left:0;right:0;height:26vh;top:-26vh;background:linear-gradient(180deg,transparent,rgba(255,70,50,.13),transparent);animation:sweep 8s linear infinite}
.bgart::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.55}
@keyframes sweep{to{top:100%}}
.aurora i:nth-child(2){background:var(--teal)}
.aurora i{opacity:.2}

/* logo, nav, accents */
.logo .mark{background:linear-gradient(135deg,#ff4d2e,#ffa43d);box-shadow:0 6px 26px -6px rgba(255,77,46,.9)}
.logo b{background:linear-gradient(90deg,#fff,#ffd2c6);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{background:rgba(3,13,16,.78);border-bottom-color:rgba(110,210,210,.22)}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,77,46,.9),rgba(34,224,208,.7),transparent);opacity:.7}
.links a.on{box-shadow:inset 0 0 0 1px rgba(255,130,100,.5),0 0 22px -6px rgba(255,77,46,.6)}
.grad{background-image:linear-gradient(90deg,#ff7b5c,#ffa43d,#22e0d0,#ffa43d,#ff7b5c);background-size:220% auto}
.flow>div::before{background:linear-gradient(135deg,#ff4d2e,#ffa43d)}
.bar i{background:linear-gradient(90deg,#ff4d2e,#ffa43d)}
.radar i{background:conic-gradient(from 0deg,rgba(255,77,46,0),rgba(255,77,46,.6))}
.glass{border-color:rgba(110,210,210,.2);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025))}
.glass.card{position:relative}
.glass.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(110,210,210,.65),transparent);pointer-events:none}
textarea,input[type=text],input[type=url]{background:rgba(8,2,5,.6)}
.btn.primary{box-shadow:0 10px 30px -10px rgba(255,77,46,.95)}
.btn.danger{background:linear-gradient(135deg,#ff2d4d,#c4152f)}
.chip{background:rgba(255,255,255,.06)}
.tag.scam{background:rgba(255,77,106,.16)}

/* home hero banner (hacker + WARNING background) */
body.is-home section.hero{position:relative;overflow:hidden;padding:56px 44px;border-radius:26px;border:1px solid rgba(110,210,210,.38);
  background:linear-gradient(100deg,rgba(3,11,14,.94) 22%,rgba(3,11,14,.6) 62%,rgba(3,11,14,.78)),url(assets/bg-hacker-warning.jpg) center/cover;
  box-shadow:0 34px 90px -34px rgba(255,50,30,.55),inset 0 0 90px rgba(255,40,30,.09)}
body.is-home section.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
body.is-home section.hero>*{position:relative}
.hero .preview{background:linear-gradient(180deg,rgba(20,5,10,.78),rgba(12,3,7,.7));border-color:rgba(110,210,210,.35)}
.page-head{border-color:rgba(110,210,210,.32);background:linear-gradient(90deg,rgba(3,13,16,.95) 36%,rgba(3,13,16,.35)),var(--art) center/cover}
.page-head::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.45}
.page-head>*{position:relative;z-index:1}
#home-scanner{background:linear-gradient(rgba(3,13,16,.9),rgba(3,13,16,.84)),url(assets/bg-warning-triangle.jpg) center/cover!important}
.hl-strip{background:linear-gradient(110deg,rgba(64,6,14,.92),rgba(3,13,16,.72)),url(assets/bg-hacker-warning.jpg) center/cover!important}
.stat{border-top:2px solid rgba(255,90,70,.55)}

/* tool tiles */
.tool{transition:transform .25s,box-shadow .25s,border-color .25s}
.tool:hover{transform:translateY(-5px);border-color:rgba(255,120,95,.65)!important;box-shadow:0 26px 60px -24px rgba(255,60,40,.6);text-decoration:none!important}
.tool .chip{color:var(--amber)}

/* number + QR tools */
.check.on{border-color:rgba(255,77,106,.55);background:rgba(255,77,106,.09)}
.region-tabs button.on{background:rgba(255,84,60,.22);border-color:var(--blue2);color:#fff}
.region-tabs button[role=radio]{text-align:left}
.qr-raw{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(8,2,5,.65);border:1px solid var(--line)}
.qr-raw code{font-family:var(--mono);font-size:.84rem;word-break:break-all;white-space:pre-wrap;color:#ffe3a6}
table.kv td:first-child{color:var(--muted);width:38%;font-family:var(--font)}
table.kv td:last-child{font-family:var(--mono);text-align:left;word-break:break-all}
.cambox{position:relative;margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#000;max-width:480px}
.cambox video{width:100%;display:block;max-height:340px;object-fit:cover}
.cambox .btn{position:absolute;right:10px;bottom:10px}
.reticle{position:absolute;inset:18% 22%;border:2px solid rgba(255,77,46,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35),0 0 22px rgba(255,77,46,.7);pointer-events:none;animation:ret 1.6s ease-in-out infinite}
@keyframes ret{50%{box-shadow:0 0 0 999px rgba(0,0,0,.35),0 0 36px rgba(34,224,208,.8);border-color:rgba(34,224,208,.9)}}
.nav .wrap{max-width:1320px}
@media (max-width:1560px){.nav .pill{display:none}}
@media (max-width:1020px){body.is-home section.hero{padding:34px 22px}}

/*RULES_START*/const RULES={"CATEGORIES":[{"id":"bank","label":"Fake bank alert","icon":"bank"},{"id":"kyc","label":"KYC update scam","icon":"id"},{"id":"otp","label":"OTP theft attempt","icon":"key"},{"id":"delivery","label":"Fake delivery notice","icon":"box"},{"id":"lottery","label":"Lottery / prize scam","icon":"gift"},{"id":"gov","label":"Government impersonation","icon":"landmark"},{"id":"phishing","label":"Phishing link","icon":"link"},{"id":"job","label":"Fake job offer","icon":"briefcase"},{"id":"upi","label":"UPI payment scam","icon":"wallet"}],"PROTECT":["\\b(?:do not|don'?t|never|dont|please do not|kindly do not)\\s+(?:share|disclose|give|reveal|tell|forward)[^.\\n]{0,40}?\\b(?:otp|pin|mpin|password|cvv|code|passcode)\\b[^.\\n]{0,25}","\\bvalid for\\s+\\d+\\s*(?:min(?:ute)?s?|mins)\\b","\\b(?:bank|we|sbi|hdfc|icici|axis)\\s+(?:will\\s+)?never\\s+ask\\b[^.\\n]{0,40}","(?:ओटीपी|OTP|ওটিপি)[^।.\\n]{0,60}?(?:न करें|করবেন না|নকৰিব)"],"PROTECT_WEIGHT":-25,"SIGNALS":[{"id":"gen.urgency","cat":"general","w":10,"tactic":"Pressure","label":"Artificial urgency","why":"Scammers create time pressure so you act before you think. Genuine organisations rarely demand action within hours.","pats":["\\b(?:urgent(?:ly)?|immediate(?:ly)?|right now|act now|asap|last (?:chance|warning|reminder)|expires? (?:today|soon|in)|within \\d+ ?(?:hours?|hrs?|minutes?|mins?)|within (?:one|two|24|48) ?(?:hours?|hrs?)|today only|hurry|before midnight|final notice|without delay)\\b","(?:तुरंत|तुरन्त|फौरन|अभी ही|जल्दी करें|জলদি|তৎক্ষণাৎ|এখনই|তাড়াতাড়ি|অবিলম্বে)"]},{"id":"gen.threat","cat":"general","w":14,"tactic":"Threat","label":"Threat of blocking, penalty or legal action","why":"Fear is the scammer's main lever: 'your account will be blocked' or 'legal action' pushes you to comply.","pats":["\\b(?:account|card|sim|number|service|connection|upi|wallet|net ?banking|a/c)\\s+(?:will be|has been|is|are|got)\\s+(?:temporarily\\s+|permanently\\s+)?(?:blocked|suspended|frozen|closed|deactivated|disabled|locked|limited|disconnected|cancelled|barred)\\b","\\b(?:legal action|penalty|prosecut\\w+|permanent(?:ly)? (?:closure|blocked|suspended)|will be (?:blocked|suspended|deactivated|terminated|returned))\\b","(?:बंद हो जाएगा|बंद हो जाएगी|ब्लॉक हो जाएगा|ब्लॉक हो जाएगी|बंद कर दिया जाएगा)","(?:ব্লক হয়ে যাবে|বন্ধ হয়ে যাবে|বন্ধ হ'ব|বন্ধ হ’ব|বন্ধ হবে|ব্লক হবে|স্থগিত হবে)","\\b(?:account|khata)\\s+(?:band|block)\\s+ho\\s+(?:jayega|jayegi|jaega|jaayega)\\b"]},{"id":"gen.greeting","cat":"general","w":6,"tactic":"Impersonation","label":"Generic greeting","why":"Real banks and couriers usually address you by name. 'Dear customer' suggests a mass-sent message.","pats":["\\b(?:dear (?:customer|user|sir|madam|sir/madam|valued|account ?holder|client|beneficiary|winner|member)|valued customer|hello (?:customer|user|dear))\\b","(?:प्रिय (?:ग्राहक|उपयोगकर्ता|सदस्य)|प्रिय यूज़र)","(?:প্রিয় গ্রাহক|প্রিয় ব্যবহারকারী)"]},{"id":"gen.money","cat":"general","w":12,"tactic":"Payment","label":"Asks you to pay or transfer money","why":"Unexpected requests to pay, transfer or deposit money are the end goal of most scams.","pats":["\\b(?:pay|transfer|deposit|send|remit)\\b[^.\\n]{0,25}?(?:₹|rs\\.?|inr|\\$|usd)\\s?\\d[\\d,]*","(?:पैसे|रुपये|रुपए|₹)\\s?[\\d०-९,]+[^।.\\n]{0,25}?(?:भेजें|भेजो|जमा करें|ट्रांसफर करें|दें|दो)","[\\d০-৯,]+\\s?(?:টাকা|রুপি)[^।\\n]{0,25}?(?:পাঠান|পাঠাও|জমা|দিন|ট্রান্সফার)"]},{"id":"gen.callback","cat":"general","w":8,"tactic":"Off-platform","label":"Pushes you to call or message a number","why":"Scammers move you to a phone call or chat where they can pressure you without any filters.","pats":["\\b(?:call|contact|whatsapp|dial|reach|text)\\b[^.\\n]{0,30}?(?:\\+?\\d[\\d \\-]{8,14}\\d)"]},{"id":"gen.remote","cat":"general","w":35,"tactic":"Data request","label":"Asks you to install a remote-access app","why":"Apps like AnyDesk or TeamViewer let a stranger see and control your phone, including your banking apps. No genuine bank asks for this.","pats":["\\b(?:anydesk|any desk|teamviewer|team viewer|quick ?support|rustdesk|airdroid|ultraviewer|screen ?sharing?|share (?:your )?screen|remote (?:access|support|control))\\b","(?:स्क्रीन शेयर|स्क्रीन साझा|फोन का कंट्रोल|স্ক্রিন শেয়ার|ফোন কন্ট্রোল)"]},{"id":"gen.apk","cat":"general","w":30,"tactic":"Data request","label":"Asks you to install an app / APK file","why":"Apps installed outside the official Play Store or App Store can steal SMS, OTPs and banking data.","pats":["\\b[\\w\\-.]+\\.apk\\b","\\b(?:install|download)\\s+(?:this|the|our)\\s+(?:app|apk|application)\\b","(?:इंस्टॉल)[^।.\\n]{0,25}?(?:ऐप|एप्लिकेशन|एप)","(?:ऐप|एप्लिकेशन|एप)[^।.\\n]{0,25}?(?:इंस्टॉल)","(?:ইনস্টল)[^।\\n]{0,25}?(?:অ্যাপ|এপ)","(?:অ্যাপ|এপ)[^।\\n]{0,25}?(?:ইনস্টল)"]},{"id":"gen.newnumber","cat":"general","w":18,"tactic":"Impersonation","label":"'This is my new number' family impersonation","why":"Scammers pretend to be a relative on a new number and then ask for urgent money. Call the person on their old number to check.","pats":["\\b(?:this is my new number|my new number|new number|lost my phone|phone (?:broke|is broken|got stolen|fell))\\b","\\b(?:hi|hello|hey) (?:mum|mom|mummy|dad|papa|bhaiya|didi)\\b","(?:यह मेरा नया नंबर|मेरा नया नंबर|नया नंबर|फोन खो गया|फोन टूट गया)","(?:আমার নতুন নম্বর|নতুন নম্বর|ফোন হারিয়ে)","(?:नमस्ते|हाय)\\s?(?:मम्मी|मम्मा|पापा|दीदी|भैया)"]},{"id":"gen.sensitive","cat":"bank","w":20,"tactic":"Data request","label":"Asks for card, password or ID details","why":"Banks never ask you to type card numbers, CVV, passwords or ID numbers into a message or a link.","pats":["\\b(?:enter|share|send|provide|submit|confirm|update|verify|reply with)\\b[^.\\n]{0,40}?\\b(?:card (?:number|details)|cvv|expiry|password|net ?banking (?:id|password|details)|login (?:id|details)|aadhaar|aadhar|pan (?:card )?(?:number|details))\\b","(?:कार्ड नंबर|कार्ड नम्बर|सीवीवी|पासवर्ड|आधार नंबर|आधार नम्बर|पैन नंबर)[^।.\\n]{0,30}?(?:भेजें|भरें|डालें|बताएं|दर्ज करें|अपडेट करें)","(?:কার্ড নম্বর|সিভিভি|পাসওয়ার্ড|আধ u 'update KYC' through a link. Banks complete KYC at a branch or in their official app.","pats":["\\bkyc\\b[^.\\n]{0,50}?\\b(?:expire[sd]?|pending|update[sd]?|incomplete|verif\\w+|suspend\\w*|block\\w*|invalid|failed|mandatory)\\b","\\b(?:update|complete|verify|renew|submit)\\b[^.\\n]{0,20}?\\bkyc\\b","\\bre-?kyc\\b","(?:केवाईसी|केवाइसी|KYC)[^।.\\n]{0,50}?(?:अपडेट|समाप्त|बंद|ब्लॉक|एक्सपायर|लंबित|पूरा करें)","(?:অপডেট|কেওয়াইসি|কেৱাইচি|KYC)[^।\\n]{0,50}?(?:আপডেট|মেয়াদ|বন্ধ|ব্লক|হ'ব|হ’ব|হবে|শেষ)","(?:अपडेट|पूरा करें|वेरिफाई)[^।.\\n]{0,20}?(?:केवाईसी|केवाइसी|KYC)"]},{"id":"kyc.docs","cat":"kyc","w":10,"tactic":"Data request","label":"PAN / Aadhaar linking or verification","why":"Messages saying your PAN or Aadhaar is 'inactive' or 'needs linking' via a link are a common data-theft trick.","pats":["\\b(?:pan|aadhaar|aadhar)\\b[^.\\n]{0,30}?\\b(?:link\\w*|update[sd]?|verif\\w+|expire[sd]?|invalid|inactive|blocked)\\b","(?:पैन|आधार)[^।.\\n]{0,30}?(?:लिंक|अपडेट|वेरिफाई|बंद|ब्लॉक|निष्क्रिय)","(?:প্যান|আধার)[^।\\n]{0,30}?(?:লিংক|আপডেট|যাচাই|বন্ধ|ব্লক|নিষ্ক্রিয়)"]},{"id":"otp.request","cat":"otp","w":32,"tactic":"Data request","label":"Asks you to share an OTP / PIN / code","why":"An OTP is a key to your money. Nobody genuine – not a bank, courier or friend – needs you to read it out or send it back.","pats":["\\b(?:share|send|tell|give|read(?: out)?|forward|reply(?: with)?|provide)\\b[^.\\n]{0,30}?\\b(?:otp|one[- ]time (?:password|pin|code)|verification code|security code|upi pin|mpin|atm pin|cvv|the code|6[- ]digit code|\\d[- ]digit code)\\b","\\b(?:otp|code)\\b[^.\\n]{0,25}?\\b(?:send(?: it)? (?:back|me)|share (?:it )?with (?:me|us))\\b","(?:ओटीपी|ओ टी पी|कोड|पिन|OTP)[^।.\\n]{0,60}?(?:भेजें|भेजो|बताएं|बताइए|बताओ|शेयर करें|साझा करें|साझा कीजिए|दें|दो)","(?:ওটিপি|ও টি পি|কোড|পিন|OTP)[^।\\n]{0,60}?(?:পাঠান|পাঠাও|পাঠিয়ে|জানান|জানাও|বলুন|শেয়ার|দিন)","(?:ওটিপি|OTP)[^।\\n]{0,60}?(?:পঠাওক|জনাওক)","\\b(?:otp|code|pin)\\b[^.\\n]{0,25}?\\b(?:bhejo|bhejiye|batao|bata do|share karo|share kar do|de\\s?do|bolo)\\b","\\b(?:bhejo|bhejiye|batao|share karo|share kar do|bolo)\\b[^.\\n]{0,25}?\\b(?:otp|code|pin)\\b"]},{"id":"otp.mistake","cat":"otp","w":28,"tactic":"Pretext","label":"'Sent my code to you by mistake' pretext","why":"The 'I sent my OTP to your number by mistake' story tricks you into forwarding a code that actually belongs to YOUR account.","pats":["\\b(?:sent|received|came|went)\\b[^.\\n]{0,40}?\\b(?:by mistake|wrongly|accidentally|to (?:the )?wrong number)\\b[^.\\n]{0,60}?\\b(?:code|otp)\\b","\\b(?:code|otp)\\b[^.\\n]{0,50}?\\b(?:by mistake|accidentally|wrongly)\\b","(?:ओटीपी|कोड|OTP)[^।.\\n]{0,60}?(?:गलती से|भूल से)","(?:गलती से|भूल से)[^।.\\n]{0,60}?(?:ओटीपी|कोड|OTP)","(?:ওটিপি|কোড|OTP)[^।\\n]{0,60}?(?:ভুলে|ভুল করে|ভুলক্রমে|ভুলবশত)","(?:ভুলে|ভুল করে|ভুলক্রমে|ভুলবশত)[^।\\n]{0,60}?(?:ওটিপি|কোড|OTP)"]},{"id":"delivery.fail","cat":"delivery","w":22,"tactic":"Pretext","label":"Delivery problem notice","why":"Fake 'delivery failed / incomplete address' notices lure you to a link that asks for card details.","pats":["\\b(?:parcel|package|shipment|consignment|courier|order|delivery)\\b[^.\\n]{0,60}?\\b(?:held|on hold|failed|undelivered|could not be delivered|unable to (?:deliver|be delivered)|pending|returned|stuck|customs|incomplete address|address (?:is )?(?:incomplete|invalid|issue)|not delivered)\\b","\\bincomplete address\\b","(?:पार्सल|पैकेज|कूरियर|डिलीवरी|शिपमेंट)[^।.\\n]{0,60}?(?:रुका|वापस|नहीं पहुंच|डिलीवर नहीं|पता अधूरा|अधूरा पता|होल्ड)","(?:পার্সেল|প্যাকেজ|কুরিয়ার|ডেলিভারি)[^।\\n]{0,60}?(?:আটকে|ফেরত|পৌঁছায়নি|ঠিকানা অসম্পূর্ণ|অসম্পূর্ণ ঠিকানা)"]},{"id":"delivery.fee","cat":"delivery","w":26,"tactic":"Payment","label":"Small 'redelivery' or 'customs' fee","why":"A tiny fee is the hook – the payment page captures your card or UPI PIN. Couriers don't collect fees through SMS links.","pats":["\\b(?:redelivery|re-delivery|customs|clearance|delivery|shipping|handling|storage|reschedul\\w+)\\s+(?:fee|fees|charge|charges|duty|payment)\     if(links.some(l=>l.score>=25)) RULES.RECS.phishing.forEach(push);
    RULES.RECS.base.forEach(push);
    if(level!=='Low') RULES.RECS.report.forEach(push); else RULES.RECS.low.forEach(push);

/* ====================================================================================
   Phone-number fraud check (mirrors analyze_number in backend/engine.py) and QR-code
   payload analysis. Nothing is ever dialled, opened or fetched.

const NumberEngine=(()=>{
  const round=x=>Math.floor(x+0.5);
  const CC=Object.keys(RULES.NUMBER_COUNTRIES).sort((a,b)=>b.length-a.length);
  const CTX=Object.fromEntries(RULES.NUMBER_CONTEXT.map(c=>[c.id,c]));
  const fmt=(cc,nat)=>cc==='91'&&nat.length===10?`+91 ${nat.slice(0,5)} ${nat.slice(5)}`:(cc?`+${cc} ${nat}`:nat);
  const mk=(kind,cc,country,national,display,assumed)=>({kind,cc,country,national,display,assumed});
  function parse(raw){
    const s=(raw||'').trim();
    if(!s) return {error:'Please enter a phone number.'};
    if(s.length>40||/[^\d\s\-().+]/.test(s)) return {error:'Use digits only (spaces, dashes and a leading + are fine).'};
    let digits=s.replace(/\D/g,'');
    const plus=s.startsWith('+')||s.startsWith('00');
    if(s.startsWith('00')) digits=digits.slice(2);
    if(digits.length<3||digits.length>15) return {error:"That doesn't look like a phone number (3–15 digits expected)."};
    if(plus){
      const cc=CC.find(k=>digits.startsWith(k))||'';
      if(!cc){const c2=digits.slice(0,2),nat=digits.slice(2);return mk('intl',c2,'Unknown country code',nat,`+${c2} ${nat}`,false);}
      const nat=digits.slice(cc.length);
      if(cc==='91'){
        if(nat.length!==10) return {error:'Indian numbers have 10 digits after +91.'};
        return mk('6789'.includes(nat[0])?'mobile':'invalid-in','91','India',nat,fmt('91',nat),false);
      }
      if(nat.length<6) return {error:'That number is too short for its country code.'};
      return mk('intl',cc,RULES.NUMBER_COUNTRIES[cc],nat,`+${cc} ${nat}`,false);
    }
    if(Object.prototype.hasOwnProperty.call(RULES.NUMBER_HELPLINES,digits)) return mk('helpline','91','India',digits,digits,true);
    if(digits.length>=3&&digits.length<=6) return mk('short','91','India',digits,digits,true);
    if(digits.length===10){
      if(digits.startsWith('140')) return mk('tm140','91','India',digits,digits,true);
      if(digits.startsWith('160')) return mk('svc160','91','India',digits,digits,true);
      if('6789'.includes(digits[0])) return mk('mobile','91','India',digits,fmt('91',digits),true);
      return mk('invalid-in','91','India',digits,digits,true);
    }
    if(/^1800\d{6,7}$/.test(digits)||/^1860\d{6,7}$/.test(digits)) return mk('tollfree','91','India',digits,digits,true);
    if(digits.length===11&&digits[0]==='0'){
      const nat=digits.slice(1);
      return '6789'.includes(nat[0])?mk('mobile','91','India',nat,fmt('91',nat),true):mk('landline','91','India',nat,digits,true);
    }
    if(digits.length===12&&digits.startsWith('91')&&'6789'.includes(digits[2])){const nat=digits.slice(2);return mk('mobile','91','India',nat,fmt('91',nat),true);}
    return {error:"Couldn't recognise that number's format. Add the country code with + if it is from abroad."};
  }
  function patternChecks(nat){
    if(/(\d)\1{6,}/.test(nat)) return [['pattern',10,'warn','Repetitive digit pattern','Long runs of the same digit (like 99999 99999) are typical of throw-away or spoofed numbers.']];
    const asc='0123456789',desc='9876543210';
    for(let i=0;i<=nat.length-6;i++){const seg=nat.slice(i,i+6);if(asc.includes(seg)||desc.includes(seg))
      return [['pattern',8,'warn','Sequential digit pattern','Easy-to-remember sequences (like 123456) are common on throw-away numbers.']];}
    return [];
  }
  const TYPE={mobile:'Mobile number',intl:'International number','invalid-in':'Invalid Indian mobile format',helpline:'Short helpline code',short:'Short code',tm140:'Telemarketing series (140)',svc160:'Service / transactional series (160)',tollfree:'Toll-free number',landline:'Landline (STD)'};
  function analyze(raw,context=[]){
    context=[...new Set((context||[]).filter(c=>CTX[c]))];
    const p=parse(raw);
    const out={input:(raw||'').trim(),valid:false,score:0,level:'Low',checks:[],context,verdict:'',display:'',country:'',type:''};
    if(p.error){out.verdict=p.error;return out;}
    Object.assign(out,{valid:true,display:p.display,country:p.country,cc:p.cc,assumed:p.assumed,type:TYPE[p.kind]});
    const {kind,cc,national:nat}=p;const checks=[];let total=0;
    const add=(id,w,status,title,detail)=>{checks.push({id,weight:w,status,title,detail});total+=w;};
    if(p.assumed&&['mobile','invalid-in','tm140','svc160','landline'].includes(kind)) add('assume',0,'info','Treated as an Indian number','No country code was given, so this was read as an Indian number. Add + and the code if it came from abroad.');
    if(kind==='mobile') add('type',0,'info','Valid Indian mobile format','Starts with 6–9 and has 10 digits. A valid format does not mean the person is who they claim to be – caller names and numbers can be faked (spoofed).');
    if(kind==='invalid-in') add('invalid',25,'bad','Not a valid Indian mobile number','Indian mobile numbers start with 6, 7, 8 or 9. A call showing this number is either spoofed, internet-generated or from a different country.');
    if(kind==='intl'){
      add('foreign',12,'warn',`International number (+${cc} ${p.country})`,"If you weren't expecting a call or message from abroad, treat it with caution. Many scam calls and WhatsApp messages come from overseas numbers.");
      if(RULES.NUMBER_WATCH_CC.includes(cc)) add('watch',14,'warn',`+${cc} is a frequently reported prefix`,"Indian users and the Department of Telecommunications have warned about missed calls and WhatsApp 'job' messages from this country code. A prefix alone doesn't prove fraud.");
    }
    if(kind==='tm140') add('tm140',12,'warn','140-series (telemarketing) number','Numbers starting 140 are allotted for promotional calls. They are widely abused for unsolicited sales and sometimes fraud. Genuine service calls use the 160 series.');
    if(kind==='svc160') add('svc160',0,'info','160-series (service / transactional) number','Banks and other regulated firms use this series for genuine service calls – but numbers can be spoofed, so never share OTPs or PINs even if it looks official.');
    if(kind==='tollfree') add('tollfree',0,'info','Toll-free number','Real companies use toll-free numbers, but scammers copy them. Check the number on the company\'s own website before calling back.');
    if(kind==='landline') add('landline',0,'info','Landline (STD) number','Landlines are hard to fake but not impossible. Police, banks and courts do not make threats or demand money by phone.');
    if(kind==='helpline') add('helpline',-20,'good',`Matches a national helpline: ${RULES.NUMBER_HELPLINES[nat]}`,'This is a genuine public service number. If someone calls you *from* it demanding money or codes, it is spoofed – hang up and dial it yourself.');
    if(kind==='short') add('short',8,'warn',"Short code that can't be verified","Short codes belong to businesses or networks. This one isn't a known public helpline, so check the sender's official website.");
    if(['mobile','intl','invalid-in','tm140'].includes(kind)) patternChecks(nat).forEach(c=>add(...c));
    for(const cid of context){const c=CTX[cid];add('ctx.'+cid,c.w,c.w>=30?'bad':'warn',c.label,c.why);}
    if(p.cc==='91'&&['mobile','tm140','invalid-in'].includes(kind)&&['authority','bank','threat'].some(i=>context.includes(i)))
      add('official-mobile',20,'bad',"Officials don't use personal mobile numbers for this",'Police, courts, tax and bank officers do not phone from ordinary mobile numbers to demand money, codes or secrecy.');
    if(!checks.some(c=>c.status==='bad'||c.status==='warn')) add('clean',0,'good','No warning signs in the number itself',"That doesn't prove the caller is genuine. Tick what they asked for below to get a better assessment.");
    let score=total>0?round(100*(1-Math.exp(-Math.max(0,total)/50))):0;let floors=[];
    for(const f of RULES.NUMBER_FLOORS){if(f.all.every(i=>context.includes(i))&&f.min>score){score=f.min;floors=[f.why];}}
    score=Math.max(0,Math.min(100,score));const level=Engine.levelFor(score);
    Object.assign(out,{checks,score,level,floors});
    out.verdict={Low:'No strong warning signs. Stay alert and verify before sharing anything.',Medium:'Some warning signs. Verify through an official channel before acting.',High:"Likely a scam call or message. Don't engage, share codes or send money.",Critical:"Very likely fraud. Hang up, don't pay or share anything, and report it."}[level];
    const recs=[],used=new Set();const push=r=>{if(!used.has(r.text)){used.add(r.text);recs.push(r);}};
    if(level==='High'||level==='Critical') push({icon:'ban',text:'Hang up or stop replying. Do not call back, share codes, install anything or pay. Block the number.'});
    context.forEach(c=>{if(RULES.NUMBER_RECS[c]) push(RULES.NUMBER_RECS[c]);});
    [RULES.RECS.base[0],...RULES.RECS.base.slice(2)].forEach(push);
    if(level!=='Low') RULES.RECS.report.forEach(push);
    out.recommendations=recs;
    return out;
  }
  return {analyze,parse,CTX};
})();

const QrEngine=(()=>{

  const PSP=['ybl','ibl','axl','okaxis','okhdfcbank','okicici','oksbi','paytm','apl','upi','sbi','icici','hdfcbank','axisbank','pnb','barodampay','fbl','airtel','jio','postbank','ikwik','freecharge','pthdfc','ptyes','ptaxis','ptsbi','yesbank','yesbankltd','kotak','indus','federal','idfcbank','rbl','cnrb','unionbank','okbizaxis','boi','cub','dbs','hsbc','sc','sib','tapicici','aubank','ezetap','slice','jupiteraxis','fam','abfspay','waicici','wahdfcbank','waaxis','wasbi','naviaxis'];

    t.signals.filter(s=>s.weight>0).slice(0,6).forEach(s=>add('txt.'+s.id,Math.round(s.weight*0.8),s.weight>=15?'bad':'warn',s.label,s.why));

    if(t.score>=50) floor=Math.max(floor,Math.round(t.score*0.85));
    if(!checks.some(c=>c.status==='bad'||c.status==='warn')) add('clean',0,'good','No warning signs in the contents',"That doesn't guarantee safety – only that nothing suspicious was found inside the code.");
    whyCheck(why,add);
    return finish(out,total,floor,why);
  }
  return {analyze,WHY};
})();

/* cp→utf16 index mapping so server spans (code points) line up with JS strings */
function fixSpans(report,text){
  if(!report||!report.highlights||!String(report.engine).startsWith('server')) return report;
  const map=[];let u=0;for(const ch of text){map.push(u);u+=ch.length;}map.push(u);
  const f=i=>map[Math.min(i,map.length-1)];
  report.highlights=report.highlights.map(h=>({...h,start:f(h.start),end:f(h.end)}));
  (report.links||[]).forEach(l=>{if(l.start!=null){l.start=f(l.start);l.end=f(l.end);}});
  return report;
}
async function analyseMessage(text){
  if(S.backend){

      if(status===200&&data&&data.ok) return fixSpans(data,text);
      if(data&&data.error) throw new Error(data.error);
      throw new Error('The server returned an unexpected response.');
    }catch(e){
      if(e.name==='AbortError'||e instanceof TypeError){toast('Server unreachable – used the in-browser engine instead.');}
      else throw e;
    }
  }
  return Engine.analyzeText(text);
}

function animateGauges(root=document){
  $$('.gauge[data-score]',root).forEach(g=>{
    if(g.dataset.done) return; g.dataset.done=1;
    const score=+g.dataset.score, lv=g.dataset.level, needle=$('.needle',g), num=$('.num',g);
    setZone(g,lv);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{needle.style.transform=`rotate(${score*1.8-90}deg)`;}));
    const t0=performance.now(),D=1300;
    const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);num.textContent=Math.round(score*e);num.style.color=LV[lv].c;if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);

    $$('.zone,.legend button',g).forEach(el=>{
      el.addEventListener('mouseenter',()=>pick(el.dataset.lv));el.addEventListener('focus',()=>pick(el.dataset.lv));
      el.addEventListener('click',()=>pick(el.dataset.lv));el.addEventListener('mouseleave',reset);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(el.dataset.lv);}});

      ${r.ai_error?`<p class="small muted" style="margin-top:10px">${esc(r.ai_error)}</p>`:''}
      ${r.keywords&&r.keywords.length?`<div style="margin-top:16px"><div class="small muted" style="margin-bottom:8px">Suspicious keywords &amp; phrases identified</div><div class="row">${r.keywords.map(k=>`<span class="chip">${esc(k.word)}</span>`).join('')}</div></div>`:''}</div>
    <div class="card glass"><div class="card-head"><h3>${ico('message')} Your message, annotated</h3></div><div class="msgbox">${highlightHTML(text,r.highlights||[])}</div>${hlLegend}</div>
    <div class="card glass"><div class="card-head"><h3>${ico('alert')} Detection explanations</h3><span class="small muted">${r.signals.length} signal${r.signals.length===1?'':'s'}</span></div>${signalsHTML(r)}</div>
    ${r.links&&r.links.length?`<div class="card glass"><div class="card-head"><h3>${ico('link')} Links found <span class="chip">never opened</span></h3></div>${r.links.map(l=>`<div class="linkcard"><div class="row" style="justify-content:space-between"><code>${esc(l.url)}</code><span class="lvl ${l.level}">${l.level} · ${l.score}%</span></div>
      <p class="small muted" style="margin:6px 0">${esc(l.verdict)}</p>${l.checks.filter(c=>c.status==='bad'||c.status==='warn').slice(0,3).map(c=>`<div class="small">• ${esc(c.title)}</div>`).join('')}
      <button class="btn sm" style="margin-top:10px" data-urlscan="${esc(l.url)}">${ico('link')} Inspect in URL scanner</button></div>`).join('')}</div>`:''}
    <div class="card glass"><div class="card-head"><h3>${ico('shieldcheck')} Safety recommendations</h3></div>${recsHTML(r)}</div>
    <div class="card glass"><details><summary>${ico('cpu')} How this score was calculated <span class="small muted">(explainable)</span>${ico('chevron','chev')}</summary>
      <table class="bd"><tbody>${r.signals.map(s=>`<tr><td>${esc(s.label)}</td><td style="color:${s.weight<0?'var(--low)':'var(--text)'}">${s.weight>0?'+':''}${s.weight}</td></tr>`).join('')}
      <tr><td><b>Total weight (after genuine-wording credit)</b></td><td><b>${b.effective}</b></td></tr>
      <tr><td>Score from formula</td><td>${b.raw_score}%</td></tr>${(b.floors||[]).length?`<tr><td>Safety floor applied: ${esc(b.floors[0])}</td><td>→ ${r.rule_score||r.score}%</td></tr>`:''}</tbody></table>
      <div class="formula">score = 100 × (1 − e^(−weight / 60))</div>
      <p class="small muted" style="margin-top:10px">Each matched rule adds weight. Diminishing returns keep one weak signal from looking like a scam, while several together climb quickly. Certain high-danger combinations (such as asking for an OTP) set a minimum score.</p></details></div>
  </div></div>`;
}
function bindReport(root,r,text,quiet){
  try{if(quiet){if(r&&r.score>=20&&!root.querySelector('.fraud-banner'))alertFor(root,r,'message',true);}else alertFor(root,r,'message');}catch(e){console.error(e);}
  animateGauges(root);
  $$('[data-copy]',root).forEach(b=>b.onclick=()=>copyText(reportText(r,text)));
  $$('[data-urlscan]',root).forEach(b=>b.onclick=()=>{S.pendingUrl=b.dataset.urlscan;location.hash='#/url';});
}

function bindScanner(p,onRun,onClear){
  const ta=$('#'+p+'-text'),cnt=$('#'+p+'-count'),err=$('#'+p+'-err'),btn=$('#'+p+'-go');
  const upd=()=>{cnt.textContent=`${ta.value.length} / 5000`;};
  const showErr=m=>{err.hidden=false;err.style.animation='none';void err.offsetWidth;err.style.animation='';err.textContent=m;};
  let busy=false;
  async function run(){
    const text=ta.value.trim();
    if(!text){showErr('Please paste a message first, or pick one of the demo scenarios.');ta.focus();return;}
    if(busy)return;busy=true;btn.disabled=true;err.hidden=true;
    try{await onRun(text);}catch(e){showErr(e.name==='AbortError'?'The request timed out. Please try again.':(e.message||'Something went wrong. Please try again.'));}
    finally{busy=false;btn.disabled=false;}
  }
  ta.addEventListener('input',()=>{upd();err.hidden=true;});
  ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run();});
  btn.onclick=run;
  const fileIn=$('#'+p+'-file'),shotBtn=$('#'+p+'-shot');
  async function fromImage(b){
    if(!b||busy)return;
    if(!/^image\/(png|jpeg|webp)$/.test(b.type)){showErr('Please choose a PNG, JPG or WEBP screenshot.');return;}
    if(b.size>8*1024*1024){showErr('That image is larger than 8 MB.');return;}
    err.hidden=true;shotBtn.disabled=true;const old=shotBtn.innerHTML;shotBtn.innerHTML=ico('refresh')+' Reading screenshot…';
    try{const e=await ocrExtract(b,true);ta.value=e.text.slice(0,5000);upd();toast('Text extracted from screenshot');shotBtn.innerHTML=old;shotBtn.disabled=false;await run();}
    catch(e){showErr(e.name==='AbortError'?'The request timed out. Please try again.':(e.message||'Could not read that screenshot.'));}
    finally{shotBtn.disabled=false;shotBtn.innerHTML=old;}
  }
  shotBtn.onclick=()=>fileIn.click();
  fileIn.onchange=()=>{const f=fileIn.files[0];fileIn.value='';fromImage(f);};
  ta.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();fromImage(it.getAsFile());}});
  ['dragenter','dragover'].forEach(ev=>ta.addEventListener(ev,e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();ta.classList.add('dragover');}}));
  ['dragleave','drop'].forEach(ev=>ta.addEventListener(ev,()=>ta.classList.remove('dragover')));
  ta.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f){e.preventDefault();fromImage(f);}});
  $('#'+p+'-paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){ta.value=t.slice(0,5000);upd();toast('Pasted from clipboard');}else toast('Clipboard is empty');}catch(_){toast('Clipboard blocked – press Ctrl/Cmd+V in the box instead.');ta.focus();}};
  $('#'+p+'-clear').onclick=()=>{ta.value='';upd();err.hidden=true;ta.focus();onClear&&onClear();};
  $$('[data-demo]').forEach(b=>b.onclick=()=>{const d=RULES.DEMOS.find(x=>x.id===b.dataset.demo);ta.value=d.text;upd();$('#'+p+'-scanner').scrollIntoView({behavior:'smooth',block:'center'});run();});
  return {set(t){ta.value=t;upd();},run};
}
const MSG_STEPS=['Normalising and reading the text','Matching known scam patterns','Inspecting links (without opening them)','Scoring risk and writing the explanation'];
async function runMessage(text,target,mode){
  const r=await withLoader(target,'Analysing message…',MSG_STEPS,()=>analyseMessage(text));
  S.last={text,report:r};
  target.innerHTML=mode==='full'?fullReportHTML(r,text):compactReportHTML(r);
  bindReport(target,r,text);
  target.scrollIntoView({behavior:'smooth',block:'start'});
}

        const s=this.ctx.createBufferSource();s.buffer=this.ctx.createBuffer(1,1,22050);s.connect(this.ctx.destination);s.start(0);
        if(!this.buf&&!this.decoding){this.decoding=true;
          new Promise((ok,no)=>this.ctx.decodeAudioData(this.bytes(),ok,no)).then(b=>{this.buf=b;}).catch(()=>{this.decoding=false;});}
      }
    }catch(_){}
    if(!this.primed){this.primed=true;try{const a=this.audioEl();a.muted=true;const pr=a.play();
      if(pr&&pr.then)pr.then(()=>{if(!this.playing){a.pause();a.currentTime=0;}a.muted=false;}).catch(()=>{a.muted=false;});}catch(_){}}
    return this.ctx;
  },
  audioEl(){if(!this.el){const a=new Audio(ALARM_FILE);a.preload='auto';a.loop=true;a.volume=1;this.el=a;}return this.el;},
  start(ms,force=false){
    if(!S.sound&&!force)return false;
    this.stop();
    this.playing=true;
    this.timer=setTimeout(()=>this.stop(),16000);   /* loops ~3x, or until the user dismisses the alert */
    /* 1st choice: Web Audio (most reliable after the first tap) */
    try{
      if(this.ctx&&this.buf){
        if(this.ctx.state!=='running')this.ctx.resume();
        const s=this.ctx.createBufferSource();s.buffer=this.buf;s.loop=true;s.connect(this.ctx.destination);s.start(0);this.src=s;return true;
      }
    }catch(_){}
    /* 2nd choice: a normal <audio> element playing the same embedded file */
    try{const a=this.audioEl();a.muted=false;a.loop=true;a.currentTime=0;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});return true;}catch(_){}
    this.playing=false;return false;
  },
  stop(){
    clearTimeout(this.timer);this.playing=false;
    if(this.src){try{this.src.stop();}catch(_){}try{this.src.disconnect();}catch(_){}this.src=null;}
    if(this.el){try{this.el.pause();this.el.currentTime=0;}catch(_){}}
  }};

function reasonsOf(r){

async function ocrExtract(blob,textOnly=false){
  if(S.backend&&S.backend.ocr){
    const fd=new FormData();fd.append('image',blob,'upload.png');
    if(textOnly){
      const {status,data}=await api('/api/ocr/extract',{method:'POST',body:fd},60000);
      if(status===200&&data&&data.ok){if(!data.text)throw new Error('No readable text was found in that image. Try a sharper, closer screenshot.');return {text:data.text,report:null};}
      if(status!==503)throw new Error((data&&data.error)||'The server could not read that image.');
    }else{
      const {status,data}=await api('/api/analyze/screenshot',{method:'POST',body:fd},60000);
      if(status===200&&data&&data.ok)return {text:data.extracted_text,report:fixSpans(data,data.extracted_text)};
      if(status!==503)throw new Error((data&&data.error)||'The server could not read that image.');
    }
  }
  const text=await browserOCR(blob);
  if(!text)throw new Error('No readable text was found in that image. Try a sharper, closer screenshot.');
  return {text,report:null};
}

function shotPage(){
  return {html:`<div class="page-head"><span class="eyebrow">${ico('image')} Screenshot Scanner</span><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Upload a screenshot</h1><p style="margin-top:8px">Got a scam in a chat you can't copy from? Upload a screenshot. We extract the text with OCR and run it through the same detection engine.</p></div>
  <section class="card glass"><div class="card-head"><h2>${ico('upload')} Upload</h2><span class="small muted">PNG · JPG · WEBP · up to 8 MB</span></div>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose or drop a screenshot"><div class="big">${ico('upload')}</div><b>Drag &amp; drop a screenshot here</b><p class="muted small">or click to browse · you can also paste an image with Ctrl/Cmd + V</p></div>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
  <div id="shot-prev" hidden class="shot" style="margin-top:16px"><img id="shot-img" alt="Uploaded screenshot preview"><div><p class="small muted" id="shot-name" style="margin-bottom:12px"></p><div class="row"><button class="btn primary" id="shot-go" type="button">${ico('scan')} Extract text &amp; analyse</button><button class="btn ghost" id="shot-rm" type="button">${ico('trash')} Remove</button></div></div></div>
  <div class="row" style="margin-top:14px"><span class="small muted">No screenshot handy?</span><button class="btn sm" id="shot-sample" type="button">${ico('image')} Use a sample screenshot</button></div>
  <div class="err" id="shot-err" role="alert" hidden></div>
  <div class="notice">${ico('lock')}<span id="shot-priv">Your image is processed in memory and never saved.</span></div></section>
  <div id="shot-result" style="margin-top:18px"></div>`,
  mount(){
    const drop=$('#drop'),file=$('#file'),prev=$('#shot-prev'),img=$('#shot-img'),err=$('#shot-err'),res=$('#shot-result'),go=$('#shot-go');
    let blob=null,url=null,sampleIdx=0;
    $('#shot-priv').textContent=S.backend&&S.backend.ocr?'Your image is sent only to this ScamShield server, processed in memory for OCR, and never saved.':'OCR runs in your browser – the image never leaves your device.';
    const fail=m=>{err.hidden=false;err.textContent=m;};
    function setBlob(b,name){
      err.hidden=true;res.innerHTML='';
      if(!b||!/^image\/(png|jpeg|webp)$/.test(b.type)){fail('Please choose a PNG, JPG or WEBP image.');return;}
      if(b.size>8*1024*1024){fail('That image is larger than 8 MB.');return;}
      if(url)URL.revokeObjectURL(url);blob=b;url=URL.createObjectURL(b);img.src=url;$('#shot-name').textContent=name||'Pasted image';prev.hidden=false;
    }
    drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}};
    file.onchange=()=>{if(file.files[0])setBlob(file.files[0],file.files[0].name);file.value='';};
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)setBlob(f,f.name);});
    const onPaste=e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){setBlob(it.getAsFile(),'Pasted image');toast('Image pasted');}};
    document.addEventListener('paste',onPaste);S.cleanup.push(()=>document.removeEventListener('paste',onPaste));
    $('#shot-rm').onclick=()=>{blob=null;prev.hidden=true;res.innerHTML='';err.hidden=true;};
    $('#shot-sample').onclick=async()=>{const ids=['delivery','bank','lottery'];const d=RULES.DEMOS.find(x=>x.id===ids[sampleIdx++%ids.length]);const b=await makeSampleShot(d.text);setBlob(b,'sample-screenshot.png');};
    const extract=()=>ocrExtract(blob);
    go.onclick=async()=>{
      if(!blob)return;go.disabled=true;err.hidden=true;
      try{
        const out=await withLoader(res,'Reading screenshot…',['Preparing the image','Extracting text with OCR','Running fraud detection','Writing the explanation'],async()=>{const e=await extract();if(!e.report)e.report=await analyseMessage(e.text);return e;},2200);
        showShot(out.text,out.report);
      }catch(e){res.innerHTML='';fail(e.name==='AbortError'?'The request timed out. Please try again.':(e.message||'Could not read that screenshot.'));}
      finally{go.disabled=false;}
    };
    function showShot(text,report){
      S.last={text,report};
      res.innerHTML=`<div class="card glass" style="margin-bottom:18px"><div class="card-head"><h3>${ico('search')} Text extracted from the screenshot</h3><span class="small muted">OCR can make mistakes – edit it and re-run</span></div>
        <textarea id="shot-text" maxlength="5000" aria-label="Extracted text">${esc(text)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="shot-re" type="button">${ico('refresh')} Re-analyse edited text</button></div><div class="err" id="shot-err2" role="alert" hidden></div></div><div id="shot-rep"></div>`;
      const rep=$('#shot-rep');rep.innerHTML=fullReportHTML(report,text);bindReport(rep,report,text);
      $('#shot-re').onclick=async()=>{const t=$('#shot-text').value.trim();if(!t){const e2=$('#shot-err2');e2.hidden=false;e2.textContent='There is no text to analyse.';return;}
        try{const r=await withLoader(rep,'Re-analysing…',MSG_STEPS,()=>analyseMessage(t),1200);S.last={text:t,report:r};rep.innerHTML=fullReportHTML(r,t);bindReport(rep,r,t);}
        catch(e){const e2=$('#shot-err2');e2.hidden=false;e2.textContent=e.message;}};
      res.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }};
}

function awarenessPage(){
