function aboutPage(){
  return {html:`<div class="page-head"><span class="eyebrow">${ico('info')} About Project</span><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">ScamShield – AI-Powered Digital Fraud Detection</h1><p style="margin-top:8px">A privacy-first prototype that helps everyday people tell genuine messages from scams, and understand <i>why</i>.</p></div>
  <div class="grid g2"><div class="glass card"><div class="card-head"><h2>${ico('alert')} Problem statement</h2></div><p class="muted">With the rise of digital communication, people constantly receive fraudulent SMS, WhatsApp messages, emails and links pretending to be banks, delivery services and government bodies. Many individuals struggle to distinguish genuine from fraudulent messages, and losses happen in minutes. ScamShield helps users identify potentially fraudulent messages, understand the risks, and learn how to protect themselves.</p></div>
  <div class="glass card"><div class="card-head"><h2>${ico('target')} Objectives</h2></div><ul class="tick">${['Analyse pasted SMS, WhatsApp and email text','Inspect suspicious URLs without opening them','Read screenshots with OCR and analyse them','Detect nine major scam families','Explain every verdict in plain language','Give clear, actionable safety steps','Educate users with examples and a quiz'].map(x=>`<li>${ico('check')}<span>${x}</span></li>`).join('')}</ul></div></div>
  <section class="block"><h2 class="sec">How detection works</h2><p class="muted" style="margin-bottom:16px">Explainable by design – every point of risk can be traced to a visible reason.</p>
  <div class="grid g3"><div class="glass card"><div class="chip" style="margin-bottom:10px">${ico('layers')} Layer 1</div><h3>Rule-based engine</h3><p class="muted small">${RULES.SIGNALS.length}+ weighted patterns for urgency, threats, OTP requests, fees, impersonation and more. Each match is highlighted in your message.</p></div>
  <div class="glass card"><div class="chip" style="margin-bottom:10px">${ico('search')} Layer 2</div><h3>NLP-style text analysis</h3><p class="muted small">Text is normalised and analysed for context – e.g. “Do not share your OTP” is understood as a safety notice, not an OTP request. Entities such as phone numbers, UPI IDs and amounts are extracted.</p></div>
  <div class="glass card"><div class="chip" style="margin-bottom:10px">${ico('cpu')} Layer 3</div><h3>Optional AI second opinion</h3><p class="muted small">If a server-side OpenAI or Anthropic key is configured, an AI judgement is blended in. It can’t talk a clear scam pattern down. Without a key, everything still works.</p></div></div></section>
  <section class="block"><h2 class="sec">Architecture</h2><div class="glass card" style="margin-top:14px"><div class="arch">
    <div class="node"><div class="ic">${ico('globe')}</div><b>Web app</b><span>Responsive single-page UI</span></div><span class="arrow">→</span>
    <div class="node"><div class="ic">${ico('server')}</div><b>REST API</b><span>Python Flask · rate-limited · stateless</span></div><span class="arrow">→</span>
    <div class="node"><div class="ic">${ico('shield')}</div><b>Detection engine</b><span>Rules · URL analyser · entity extraction</span></div><span class="arrow">→</span>
    <div class="node"><div class="ic">${ico('cpu')}</div><b>Optional AI</b><span>Key kept on the server</span></div></div>
    <p class="small muted" style="margin-top:14px;text-align:center">If the server isn’t reachable, the same engine runs <b>in your browser</b>, so a demo never fails. OCR uses Tesseract on the server, or Tesseract.js in the browser.</p></div></section>
  <section class="block"><div class="grid g2" style="align-items:start"><div class="glass card"><div class="card-head"><h2>${ico('layers')} Technology</h2></div><table class="tech"><tbody>
    <tr><td>Frontend</td><td>HTML5, CSS3 (glassmorphism design system), vanilla JavaScript – one self-contained file, no build step</td></tr>
    <tr><td>Backend</td><td>Python 3 · Flask REST API</td></tr>
    <tr><td>Detection</td><td>Rule-based fraud engine, URL structure analyser, regex-driven NLP entity extraction</td></tr>

async function analyseNumber(number,context){
  if(S.backend){
    try{
      const {status,data}=await api('/api/analyze/number',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number,context})});
      if(status===200&&data&&data.ok) return data;
      if(data&&data.error) throw new Error(data.error);
      throw new Error('The server returned an unexpected response.');
    }catch(e){
      if(e.name==='AbortError'||e instanceof TypeError){toast('Server unreachable – used the in-browser engine instead.');}
      else throw e;
    }
  }
  const r=NumberEngine.analyze(number,context); if(!r.valid) throw new Error(r.verdict); r.engine='browser-rules'; return r;
}

const QR_SAMPLES=[

async function decodeQrFromCanvas(cv){
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  if('BarcodeDetector' in window){
    try{const det=new BarcodeDetector({formats:['qr_code']});const f=await det.detect(cv);if(f&&f[0]&&f[0].rawValue)return f[0].rawValue;}catch(_){}
  }
  if(!window.jsQR) await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
  const d=ctx.getImageData(0,0,cv.width,cv.height);
  const hit=window.jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
  return hit&&hit.data?hit.data:null;
}
async function decodeQrFromBlob(blob){
  let bmp;
  try{bmp=await createImageBitmap(blob);}catch(_){throw new Error("That file isn't a readable image (use PNG, JPG or WEBP).");}
  /* try the full image first, then smaller sizes – big photos can defeat the decoder */
  for(const maxDim of [1600,900,500]){
    const k=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bmp.width*k));cv.height=Math.max(1,Math.round(bmp.height*k));
    const c=cv.getContext('2d',{willReadFrequently:true});c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(bmp,0,0,cv.width,cv.height);
    const v=await decodeQrFromCanvas(cv);if(v)return v;
  }
  return null;
}

/* ====================================================================================
   v7 – Scam emergency assistant. EmergencyEngine mirrors build_emergency() in
   backend/engine.py; the page uses the server when one is running.
   ==================================================================================== */
const EmergencyEngine=(()=>{
  const ORDER=['Now','Within 1 hour','Within 24 hours'];
  const INC=Object.fromEntries(RULES.EMERGENCY.incidents.map(i=>[i.id,i]));
  function build(ids,timing){
    const picked=[...new Set((ids||[]).filter(x=>typeof x==='string'&&INC[x]))];
    if(!picked.length) return {valid:false,error:'Tell us what happened so we can give you the right steps.'};
    if(!RULES.EMERGENCY.timing[timing]) timing='today';
    const seen=new Set(), steps=[];
    const add=([pri,txt])=>{if(!seen.has(txt)){seen.add(txt);steps.push({priority:pri,text:txt});}};
    picked.forEach(i=>INC[i].steps.forEach(add));
    RULES.EMERGENCY.always.forEach(add);
    const sorted=steps.map((s,k)=>[s,k]).sort((a,b)=>(ORDER.indexOf(a[0].priority)-ORDER.indexOf(b[0].priority))||(a[1]-b[1])).map(x=>x[0]);
    const urgent=picked.some(i=>INC[i].urgent);
    return {valid:true,ok:true,urgency:(urgent||timing==='just')?'Act now':'Act soon',timing,
      timing_note:RULES.EMERGENCY.timing[timing],incidents:picked.map(i=>({id:i,label:INC[i].label})),
      steps:sorted,helplines:RULES.EMERGENCY.helplines,disclaimer:RULES.EMERGENCY.disclaimer,engine:'browser-rules'};
  }
  return {build};
})();

async function emergencyPlan(ids,timing){
  if(S.backend){

      const {status,data}=await api('/api/emergency',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({incidents:ids,timing})});
      if(status===200&&data&&data.ok) return data;
      if(data&&data.error) return {valid:false,error:data.error};
    }catch(_){}
  }
  return EmergencyEngine.build(ids,timing);
}

  const GROUPS=['Now','Within 1 hour','Within 24 hours'];
  const emptyCard='<div class="glass card empty small muted">Your step-by-step plan will appear here, most urgent first.</div>';
  const helpRow=h=>{const isNum=/^\d+$/.test(h.number);return `<div class="hl-row"><div><b>${esc(h.name)}</b><span class="d">${esc(h.note)}</span></div><div class="row"><span class="chip mono">${esc(h.number)}</span>${isNum?`<a class="btn sm danger" href="tel:${esc(h.number)}">${ico('phone')} Call</a>`:`<a class="btn sm" href="https://${esc(h.number)}" target="_blank" rel="noopener noreferrer">${ico('link')} Open</a>`}</div></div>`;};
  const planText=p=>['Scam emergency plan – '+p.urgency,p.timing_note,''].concat(
    GROUPS.flatMap(g=>{const items=p.steps.filter(s=>s.priority===g);return items.length?[g+':',...items.map((s,k)=>(k+1)+'. '+s.text),'']:[];})
  ).join('\n');
  const planHTML=p=>`<div class="glass card">
    <div class="row" style="justify-content:space-between"><span class="lvl ${p.urgency==='Act now'?'Critical':'High'}">${ico('siren')} ${esc(p.urgency)}</span><span class="chip">${p.incidents.length} ${p.incidents.length===1?'issue':'issues'}</span></div>
    <p class="muted" style="margin-top:10px">${esc(p.timing_note)}</p>
    <p class="small muted" style="margin-top:6px">Tap a step to tick it off as you go. Ticks are not saved.</p>
    ${GROUPS.map(g=>{const items=p.steps.filter(s=>s.priority===g);if(!items.length)return '';
      const cls=g==='Now'?'em-now':g==='Within 1 hour'?'em-hour':'em-day';
      return `<div class="em-group ${cls}"><h4>${esc(g)}</h4>${items.map((s,k)=>`<div class="em-step" role="checkbox" aria-checked="false" tabindex="0"><span class="n">${k+1}</span><span class="t">${esc(s.text)}</span></div>`).join('')}</div>`;}).join('')}
    <div class="row" style="margin-top:14px"><button class="btn" id="emCopy" type="button">${ico('copy')} Copy plan</button></div>
    <div class="disclaim">${ico('info')}<span>${esc(p.disclaimer)}</span></div>
  </div>`;
  return {html:`<div class="page-head"><span class="eyebrow">${ico('siren')} Scam emergency assistant</span>
    <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Already clicked, paid or shared something? <span class="grad">Here's what to do next.</span></h1>
    <p style="margin-top:8px">Tell us what happened and we'll build a plan, most urgent steps first. Nothing you tick is stored.</p></div>
  <div class="urgent"><div class="ic">${ico('siren')}</div><div style="flex:1 1 260px"><b style="font-size:1.1rem">Money left your account?</b><div class="small muted">Call <b style="color:#fff">1930</b> now. Reporting within the first hour gives the best chance to freeze it.</div></div><a class="btn danger" href="tel:1930">${ico('phone')} Call 1930 now</a></div>
  <section class="block"><div class="grid g2" style="align-items:start">
    <div class="glass card">
      <div class="card-head"><h3>${ico('shieldcheck')} What happened?</h3></div>
      <p class="small muted" style="margin-bottom:12px">Tick everything that applies.</p>
      <div class="em-opts" id="emIncidents">${RULES.EMERGENCY.incidents.map(i=>`<button type="button" class="em-opt" data-id="${esc(i.id)}" aria-pressed="false">${ico(i.icon)}<span>${esc(i.label)}</span></button>`).join('')}</div>
      <h3 style="margin-top:18px;font-size:1rem">When did it happen?</h3>
      <div class="region-tabs" id="emTiming" role="radiogroup" style="margin-top:10px">${[['just','Within the last hour'],['today','Earlier today'],['earlier','Before today']].map(([k,t])=>`<button type="button" role="radio" aria-checked="${k==='today'}" class="${k==='today'?'on':''}" data-timing="${k}">${t}</button>`).join('')}</div>
      <div class="row" style="margin-top:18px"><button class="btn primary" id="emGo" type="button">${ico('zap')} Get my action plan</button><button class="btn ghost" id="emClear" type="button">Clear</button></div>
      <div class="small" id="emErr" role="alert" style="margin-top:10px;color:var(--crit)"></div>
    </div>
    <div id="emResult" aria-live="polite">${emptyCard}</div>
  </div></section>
  <section class="block"><h2 class="sec">Helplines</h2><div class="glass card">${RULES.EMERGENCY.helplines.map(helpRow).join('')}</div></section>`,
  mount(){
    let timing='today';
    const res=$('#emResult'), err=$('#emErr');
    $$('.em-opt').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.classList.toggle('on',on);err.textContent='';});
    $$('#emTiming button').forEach(b=>b.onclick=()=>{timing=b.dataset.timing;$$('#emTiming button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});});
    const bindSteps=()=>$$('.em-step').forEach(el=>{
      const t=()=>{const d=!el.classList.contains('done');el.classList.toggle('done',d);el.setAttribute('aria-checked',d);};
      el.onclick=t; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}};
    });
    $('#emGo').onclick=async()=>{
      const ids=$$('.em-opt[aria-pressed="true"]').map(b=>b.dataset.id);
      if(!ids.length){err.textContent='Tick at least one thing that happened.';return;}
      err.textContent='';
      res.innerHTML='<div class="glass card small muted">Building your plan…</div>';
      const plan=await emergencyPlan(ids,timing);
      if(!plan.valid){err.textContent=plan.error||'Something went wrong. Please try again.';res.innerHTML=emptyCard;return;}
      res.innerHTML=planHTML(plan);
      bindSteps();
      $('#emCopy').onclick=()=>copyText(planText(plan));
      if(window.matchMedia&&window.matchMedia('(max-width: 900px)').matches) res.scrollIntoView({behavior:'smooth',block:'start'});
    };
    $('#emClear').onclick=()=>{$$('.em-opt').forEach(b=>{b.setAttribute('aria-pressed','false');b.classList.remove('on');});res.innerHTML=emptyCard;err.textContent='';};
  }};
}

function buildNav(cur){
  const mk=cls=>NAV.map(([h,t,i])=>`<a href="#${h}" class="${h===cur?'on':''}" ${h===cur?'aria-current="page"':''}>${ico(i)} ${t}</a>`).join('');
  $('#links').innerHTML=mk();$('#drawer').innerHTML=mk();
}
function route(){
  S.timers.forEach(clearInterval);S.timers=[];S.cleanup.forEach(f=>f());S.cleanup=[];
  const h=(location.hash.replace(/^#/,'')||'/').split('?')[0];
  const key=PAGES[h]?h:'/';
  const page=PAGES[key]();
  buildNav(key);$('#drawer').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
  const app=$('#app');app.innerHTML=`<div class="page wrap">${page.html}</div>`;
  try{page.mount();}catch(e){console.error(e);app.innerHTML='<div class="wrap"><div class="card glass empty"><b>Something went wrong loading this page.</b><p class="small">Please refresh and try again.</p></div></div>';}
  const ART={};
  document.body.classList.toggle('is-home',key==='/');
  document.body.style.setProperty('--art','url(assets/'+'bg-hacker-warning'+'.jpg)');
  revealInit();
  window.scrollTo(0,0);
  document.title=(key==='/'?'':NAV.find(n=>n[0]===key)[1]+' · ')+'ScamShield – AI-Powered Digital Fraud Detection';
}
function boot(){
  $('#logoMark').innerHTML=ico('shieldcheck').replace('class="i "','class="i" style="width:20px;height:20px"');
  $('#burger').innerHTML=ico('menu');
  $('#burger').onclick=()=>{const d=$('#drawer'),o=d.classList.toggle('open');$('#burger').setAttribute('aria-expanded',o);};
  $('#soundBtn').onclick=()=>{S.sound=!S.sound;updateSoundBtn();if(S.sound)Alarm.unlock();else Alarm.stop();toast(S.sound?'Fraud alarm sound ON':'Fraud alarm sound muted');};updateSoundBtn();
  window.addEventListener('hashchange',route);
  route();detectBackend();
}
boot();
</script>
</body>
</html>
